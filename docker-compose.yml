services:
  postgres:
    image: postgres:17-alpine
    container_name: mysns-postgres
    environment:
      POSTGRES_DB: mysns
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d mysns"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    # GHCR 에 푸시된 amd64 이미지 사용. 빌드는 buildx 로 별도 수행 후 pull.
    #   docker buildx build --platform linux/amd64 -t ghcr.io/qwerty55558/mysns-api:latest --push .
    #   docker compose pull api && docker compose up -d
    image: ghcr.io/qwerty55558/mysns-api:latest
    pull_policy: always
    container_name: mysns-api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # default: postgres 통신용 내부망 / payflow-net: nginx·FE 와 공유
      # nginx upstream 이 payflow-backend 로 찾으므로 해당 alias 를 단다.
      default: {}
      payflow-net:
        aliases:
          - payflow-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mysns
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # 운영 기본값: 스키마 보존(update) + dev-mode off. 미설정 시 compose 기본 적용.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      MYSNS_SECURITY_DEVMODE: ${MYSNS_SECURITY_DEVMODE:-false}
      MYSNS_JWT_SECRET: ${MYSNS_JWT_SECRET:?MYSNS_JWT_SECRET 를 .env 에 설정하세요 (256bit 이상)}
      MYSNS_CORS_ALLOWEDORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:+UseContainerSupport}
    # 호스트 포트 미개방 — nginx 가 payflow-net 내부에서 api:8080 으로 프록시.
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    container_name: mysns-vm
    profiles: ["observability"]
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
      - ./observability/vmagent/scrape.yml:/etc/vm/scrape.yml:ro
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=14d"
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-memory.allowedPercent=30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: mysns-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mysns-grafana
    profiles: ["observability"]
    # 호스트 포트 미개방 — nginx 가 payflow-net 내부에서 mysns-grafana:3000 으로 프록시.
    # 외부에 3001 을 열면 nginx 의 auth_request 게이트를 우회할 수 있으므로 절대 금지.
    # 로컬 디버깅만 필요하면 루프백에 한정: "127.0.0.1:3001:3000".
    networks:
      # default: victoriametrics·loki 데이터소스 통신용 내부망 (기존 동작 유지 필수)
      # payflow-net: nginx 가 컨테이너 이름(mysns-grafana)으로 프록시
      default: {}
      payflow-net:
        aliases:
          - mysns-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # admin/admin 탈출 필수 — .env 의 GRAFANA_ADMIN_PASSWORD 주입.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 설정하세요}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 서브패스 배포 — 공개 URL 은 https://payflow.clauminirockpt.me/grafana/
      GF_SERVER_ROOT_URL: "https://payflow.clauminirockpt.me/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # auth.proxy 자동로그인 — nginx 가 인가한 X-WEBAUTH-USER 헤더를 신뢰해 이중 로그인 제거.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      # grafana 가 보는 소스 IP = nginx 컨테이너(유동). grafana 포트를 외부에 안 열었으므로
      # nginx 를 거치지 않으면 도달 자체가 불가 → 실질 위험 없음.
      # 더 엄격히 하려면 grafana 를 고정 서브넷에 묶고 그 대역만 허용.
      GF_AUTH_PROXY_WHITELIST: "0.0.0.0/0"
      # auth.proxy 로 자동 생성되는 유저 기본 역할(대시보드 보려면 Viewer 이상).
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Editor"
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped

networks:
  # nginx·FE·BE 공용 외부 네트워크. 사전에 한 번만 생성:
  #   docker network create payflow-net
  payflow-net:
    external: true

volumes:
  pgdata:
  uploads:
  vm-data:
  loki-data:
  grafana-data:
