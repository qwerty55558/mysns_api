services:
  postgres:
    image: postgres:17-alpine
    container_name: mysns-postgres
    environment:
      POSTGRES_DB: mysns
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d mysns"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysns-api:latest
    container_name: mysns-api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # default: postgres 통신용 내부망 / payflow-net: nginx·FE 와 공유(컨테이너명 api 로 접근)
      - default
      - payflow-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mysns
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # 운영 기본값: 스키마 보존(update) + dev-mode off. 미설정 시 compose 기본 적용.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      MYSNS_SECURITY_DEVMODE: ${MYSNS_SECURITY_DEVMODE:-false}
      MYSNS_JWT_SECRET: ${MYSNS_JWT_SECRET:?MYSNS_JWT_SECRET 를 .env 에 설정하세요 (256bit 이상)}
      MYSNS_CORS_ALLOWEDORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:+UseContainerSupport}
    # 호스트 포트 미개방 — nginx 가 payflow-net 내부에서 api:8080 으로 프록시.
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    container_name: mysns-vm
    profiles: ["observability"]
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
      - ./observability/vmagent/scrape.yml:/etc/vm/scrape.yml:ro
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=14d"
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-memory.allowedPercent=30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: mysns-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mysns-grafana
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped

networks:
  # nginx·FE·BE 공용 외부 네트워크. 사전에 한 번만 생성:
  #   docker network create payflow-net
  payflow-net:
    external: true

volumes:
  pgdata:
  uploads:
  vm-data:
  loki-data:
  grafana-data:
