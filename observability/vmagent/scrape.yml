global:
  scrape_interval: 15s
  external_labels:
    cluster: local
    env: dev

scrape_configs:
  - job_name: mysns-be
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          app: mysns
          component: backend

  - job_name: victoriametrics
    static_configs:
      - targets:
          - localhost:8428
