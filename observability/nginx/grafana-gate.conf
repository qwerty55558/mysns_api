# ─────────────────────────────────────────────────────────────────────────────
# Grafana admin-only 게이트 (nginx 리버스 프록시 + auth_request 인가 위임)
#
# ⚠️ 이 파일은 "레퍼런스/버전관리용" 입니다. 이 be 레포의 docker-compose 가
#    로드하지 않습니다. 실제 nginx(호스트 또는 별도 컨테이너)의 설정에 아래
#    블록들을 반영해야 동작합니다.
#
# 토폴로지:
#   브라우저 ─443─▶ [nginx] ──/grafana/──▶ (auth_request: BFF 세션이 ADMIN 인지 확인)
#                                        └─ 통과 시 ─▶ mysns-grafana:3000 (payflow-net)
#   - grafana 는 호스트 포트를 열지 않음(docker-compose 에서 ports 제거). nginx 를
#     거치지 않으면 도달 불가 → 게이트 우회 원천 차단.
#   - BFF(payflow-frontend)가 X-WEBAUTH-USER 응답 헤더로 인가된 사용자명을 내려주고,
#     nginx 가 그 값으로 덮어써 Grafana auth.proxy 자동로그인에 사용(클라 위조 무력화).
#
# 전제: grafana 가 docker-compose 에서 payflow-net 에 alias `mysns-grafana` 로 합류.
# ─────────────────────────────────────────────────────────────────────────────

# ── http 블록에 한 번 (이미 있으면 생략) ────────────────────────────────────────
# WebSocket 업그레이드용 connection 헤더 매핑 (Grafana Live).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 같은 compose 망(payflow-net)에서 컨테이너 이름으로 접근.
# 호스트 nginx 라 docker 망에 못 붙으면 127.0.0.1:3001 (로컬 디버그 포트)로 변경.
upstream grafana {
    server mysns-grafana:3000;
}

# ── 443 server 블록 안 ──────────────────────────────────────────────────────────
# (기존 location / , /graphql , /events 등은 그대로 두고 아래만 추가)

# 내부 인가 위임 엔드포인트 — 외부에서 직접 호출 불가(internal).
# BFF 가 세션 쿠키를 보고 ADMIN 이면 200(+X-WEBAUTH-USER), 아니면 401/403.
location = /api/grafana-auth {
    internal;
    proxy_pass http://payflow-frontend;
    proxy_pass_request_body off;          # 인가 판단에 body 불필요
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;  # 세션 쿠키 전달(핵심)
}

location /grafana/ {
    auth_request /api/grafana-auth;
    # BFF 가 내려준 인가된 사용자명을 변수로 캡처.
    auth_request_set $grafana_user $upstream_http_x_webauth_user;

    proxy_pass http://grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # BFF 가 인가한 값으로 덮어씀 — 클라이언트가 보낸 위조 헤더 무력화(보안 핵심).
    proxy_set_header X-WEBAUTH-USER $grafana_user;

    # Grafana Live WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 인가 실패(비로그인/비ADMIN) → 로그인 페이지로.
    error_page 401 403 = @grafana_denied;
}

location @grafana_denied {
    return 302 https://payflow.clauminirockpt.me/login;
}

# ─────────────────────────────────────────────────────────────────────────────
# 적용 + 검증
#   docker compose --profile observability up -d grafana   # compose env 재반영
#   nginx -t && nginx -s reload                             # nginx 도 컨테이너면 그쪽에서
#
#   # 게이트 직접 검증 (BFF 인가 엔드포인트는 internal 이라 외부 호출은 404,
#   # 실제 검증은 /grafana/ 로):
#   curl -s -o /dev/null -w '%{http_code}\n' https://payflow.clauminirockpt.me/grafana/
#     → 비로그인: 302 (→ /login)  /  ADMIN 쿠키: 200
#
#   브라우저에서 admin 으로 프론트 로그인 → 새 탭 /grafana/ → 로그인 화면 없이
#   대시보드면 성공. 일반 유저는 /login 으로 튕김.
#
# 주의 — BFF 측 /api/grafana-auth 핸들러는 FE 레포에서 구현해야 합니다.
#   세션의 user.role === 'ADMIN' 이면 200 + 헤더 X-WEBAUTH-USER: <username>,
#   아니면 401. (BE GraphQL me{ role } 또는 세션 클레임으로 판별)
# ─────────────────────────────────────────────────────────────────────────────
