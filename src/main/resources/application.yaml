mysns:
  security:
    dev-mode: true
  jwt:
    secret: dev-only-secret-please-replace-in-production-must-be-at-least-256-bits-long-padding
    access-ttl: 15m
    refresh-ttl: 30d
  cors:
    allowed-origins: http://localhost:3000
  upload:
    dir: ./uploads
    public-prefix: /uploads
    temp-ttl: 24h
    cleanup-cron: "0 0 * * * *"   # 매 정시
  ocr:
    enabled: true
    confidence-threshold: 0.7
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout: ${GEMINI_TIMEOUT:30s}
  notification:
    cooldown: 12h

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mysns
  servlet:
    multipart:
      enabled: true
      max-file-size: 8MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mysns}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        generate_statistics: true
    open-in-view: false
    show-sql: false
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

server:
  error:
    include-message: always  # REST 에러 응답에 ResponseStatusException.reason 노출

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.graphql: INFO
    # N+1 가시성 — 개발 단계에서만 SQL 로깅. 운영에서는 WARN 이상으로.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG
