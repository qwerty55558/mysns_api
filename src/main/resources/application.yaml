mysns:
  security:
    dev-mode: true
  jwt:
    secret: dev-only-secret-please-replace-in-production-must-be-at-least-256-bits-long-padding
    access-ttl: 15m
  cors:
    allowed-origins: http://localhost:3000
  upload:
    dir: ./uploads
    public-prefix: /uploads
  ocr:
    enabled: true
    base-url: http://localhost:8001
    timeout: 15s

spring:
  application:
    name: mysns
  servlet:
    multipart:
      enabled: true
      max-file-size: 8MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mysns}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        generate_statistics: true
    open-in-view: false
    show-sql: false
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

server:
  error:
    include-message: always  # REST 에러 응답에 ResponseStatusException.reason 노출

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.graphql: INFO
    # N+1 가시성 — 개발 단계에서만 SQL 로깅. 운영에서는 WARN 이상으로.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG
